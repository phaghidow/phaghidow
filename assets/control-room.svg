<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Control Room — Moncef Bensaid</title>
  <desc id="desc">A dark experimental grid with animated lime, violet and cyan signal paths.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#26262D" stroke-width="1"/>
    </pattern>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#C8FF00"/>
      <stop offset=".52" stop-color="#36D6E8"/>
      <stop offset="1" stop-color="#B99AFF"/>
    </linearGradient>
  </defs>
  <rect x="28" y="28" width="1544" height="464" rx="4" fill="url(#grid)" opacity=".8"/>
  <path d="M28 92H1572M28 428H1572" stroke="#303038"/>
  <path d="M1020 28V492M1270 28V492M1450 28V492" stroke="#24242C"/>
  <g fill="#92929D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">
    <text x="64" y="70">CONTROL ROOM / 001</text>
    <text x="1536" y="70" text-anchor="end">PLAYGROUND FOR IDEAS</text>
    <text x="64" y="458">SOFTWARE / SYSTEMS / SIGNALS</text>
    <text x="1536" y="458" text-anchor="end">ISIL → RSE / M1</text>
  </g>
  <g fill="#F4F4F0" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="64" y="210" font-size="72" letter-spacing="-2">HELLO, WORLD.</text>
    <text x="64" y="292" font-size="72" letter-spacing="-2">I BUILD <tspan fill="#C8FF00">THINGS.</tspan></text>
  </g>
  <g fill="#92929D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="68" y="344">MONCEF BENSAID</text>
    <text x="68" y="370">SOFTWARE ENGINEERING / INFORMATION SYSTEMS</text>
  </g>
  <g fill="none" stroke="url(#signal)" stroke-width="2">
    <path d="M1000 130H1110L1160 180H1280L1330 130H1510"/>
    <path d="M1020 300H1080L1120 260H1240L1290 310H1510"/>
    <path d="M1160 180V260M1330 130V310"/>
    <path d="M1000 130H930" stroke="#C8FF00" stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-45" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#C8FF00">
    <circle cx="1000" cy="130" r="5"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="180" r="5"/>
    <circle cx="1280" cy="180" r="5"/>
    <circle cx="1330" cy="130" r="5"/>
  </g>
  <g fill="#B99AFF">
    <circle cx="1020" cy="300" r="5"/>
    <circle cx="1240" cy="260" r="5"/>
    <circle cx="1290" cy="310" r="5"/>
  </g>
  <g fill="#36D6E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">
    <text x="1020" y="116">NODE_01</text>
    <text x="1260" y="166">SIGNAL</text>
    <text x="1360" y="116">ONLINE</text>
  </g>
  <circle cx="1518" cy="68" r="4" fill="#C8FF00"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>
